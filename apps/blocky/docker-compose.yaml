configs:
  blocky:
    file: ./_configs/blocky.yaml

networks:
  alloy_default:
    external: true

services:
  blocky:
    cap_add:
      - NET_BIND_SERVICE
    cap_drop:
      - ALL
    configs:
      - source: blocky
        target: /app/config.yml
    extends:
      file: _patches/${HOSTNAME}.yaml
      service: blocky
    healthcheck:
      disable: true
    image: ghcr.io/0xerr0r/blocky:v0.32.0@sha256:6fddc6f430221dbbfcbbef23e6913bfa4b84a6757a9715bc4bf783bb3a55a74e
    labels:
      monitoring.logs: true
      monitoring.metrics.port: 8080
    networks:
      - alloy_default
    read_only: true
    restart: always
    security_opt:
      - no-new-privileges:true
    user: 21575:21575
