configs:
  garage:
    file: ./_configs/garage.toml

networks:
  alloy_default:
    external: true
  traefik_default:
    external: true

services:
  garage-0:
    cap_drop:
      - ALL
    configs:
      - source: garage
        target: /etc/garage.toml
    env_file: .env
    image: docker.io/dxflrs/garage:v2.3.0
    labels:
      monitoring.metrics.port: 3903
      traefik.enable: true
      traefik.http.routers.garage-s3.entrypoints: http,https
      traefik.http.routers.garage-s3.rule: Host(`s3.zarantonello.dev`)
      traefik.http.routers.garage-s3.service: garage-s3
      traefik.http.services.garage-s3.loadbalancer.server.port: 3900
    networks:
      - alloy_default
      - traefik_default
    read_only: true
    restart: always
    security_opt:
      - no-new-privileges:true
    user: 18781:18781
    volumes:
      - $HOME/volumes/garage/data/0:/var/lib/garage/data
      - $HOME/volumes/garage/metadata/0:/var/lib/garage/metadata

  garage-1:
    extends:
      service: garage-0
    volumes:
      - $HOME/volumes/garage/data/1:/var/lib/garage/data
      - $HOME/volumes/garage/metadata/1:/var/lib/garage/metadata
