db_engine = "lmdb"
	
block_size = "5M"
compression_level = 10

data_dir = "/var/lib/garage/data"
metadata_dir = "/var/lib/garage/metadata/db"
metadata_snapshots_dir = "/var/lib/garage/metadata/snapshots"
metadata_auto_snapshot_interval = "6h"
	
replication_factor = 2
consistency_mode = "consistent"

rpc_bind_addr = "[::]:3901"

[s3_api]
s3_region = "default"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
