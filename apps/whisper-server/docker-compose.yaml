services:
  whisper:
    command: |
      --host 0.0.0.0
      --port 8079
      -pp
      --model /models/ggml-large-v3-turbo.bin
    devices:
      - /dev/dri
    entrypoint: whisper-server
    image: ghcr.io/ggml-org/whisper.cpp:main-vulkan@sha256:d141ce7a43f455573b4be63a8896f93f76075a5a36ddb4558e622e2c7070d7eb
    ports:
      - 127.0.0.1:8079:8079
    read_only: true
    restart: always
    user: 1000:1000
    volumes:
      - $HOME/.local/share/whisper-server/models:/models:z,ro
      - $HOME/.cache/whisper-server:/home/ubuntu/.cache:z,U
