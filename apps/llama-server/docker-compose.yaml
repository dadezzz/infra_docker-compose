services:
  llama:
    command: |
      -fit off
      -b 1024 -ub 128
      --ctx-size 65536
      -ctk q5_1 -ctv q5_1
      --model /var/lib/llama-server/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
      --jinja
      --chat-template-kwargs '{"preserve_thinking":true}'
      --spec-type draft-mtp,ngram-mod
      --temperature 0.6
      --top-k 20
      --top-p 0.95
      --min-p 0
      --presence-penalty 0.0
    devices:
      - /dev/dri
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:43559c7ce0b6475bb2fa88d4e5bd42b2350d9e3cf459de7de04e8abf687713b4
    ports:
      - 127.0.0.1:8080:8080
    read_only: true
    restart: always
    user: 1000:1000
    volumes:
      - $HOME/.local/share/llama-server:/var/lib/llama-server:z,ro
      - $HOME/.cache/llama-server:/home/ubuntu/.cache:z,U
