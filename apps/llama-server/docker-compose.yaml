networks:
  traefik_default:
    external: true

services:
  llama-server:
    command: |
      -fit off
      --no-mmap
      -b 1024 -ub 256
      --cache-ram 4096
      --models-max 1
      --models-preset /var/lib/llama-server/models.ini
    devices:
      - /dev/dri
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:bc3c0c28f45606cf1d63081282a217d72526950e066322c4bd9275267a7e14f7
    labels:
      traefik.enable: true
      traefik.http.routers.llama-server.entrypoints: http,https
      traefik.http.routers.llama-server.rule: Host(`llama.zarantonello.dev`)
      traefik.http.services.llama-server.loadbalancer.server.port: 8080
    networks:
      - traefik_default
    read_only: true
    restart: always
    user: 1000:1000
    volumes:
      - $HOME/volumes/llama-server/cache:/home/ubuntu/.cache:z,U
      - $HOME/volumes/llama-server/models:/var/lib/llama-server:z,ro
