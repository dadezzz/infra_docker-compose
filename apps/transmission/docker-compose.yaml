networks:
  traefik_default:
    external: true

services:
  caddy:
    cap_add:
      - NET_BIND_SERVICE
    cap_drop:
      - ALL
    command: caddy file-server --root /srv --access-log
    image: docker.io/library/caddy:2.11.3-alpine@sha256:86deaf5e3d3408a6ccec08fbb79989783dd26e206ae10bcf78a801dc8c9ab794
    labels:
      monitoring.logs: true
      traefik.enable: true
      traefik.http.middlewares.transmission-caddy-headers.headers.customresponseheaders.content-disposition: attachment
      traefik.http.routers.transmission-caddy.entrypoints: https
      traefik.http.routers.transmission-caddy.middlewares: transmission-caddy-headers
      traefik.http.routers.transmission-caddy.rule: Host(`torrents.zarantonello.net`) && PathPrefix(`/files/`)
      traefik.http.services.transmission-caddy.loadbalancer.server.port: 80
    networks:
      - traefik_default
    read_only: true
    restart: always
    security_opt:
      - no-new-privileges:true
    user: 27732:27732
    volumes:
      - $HOME/volumes/transmission/data:/srv/files

  transmission:
    cap_drop:
      - ALL
    image: git.zarantonello.dev/infra/transmission:4.1.1@sha256:ae659e16da27a4b6d7824f48f8c77b0926e107195e7869b7367de3fd2f27adc2
    labels:
      monitoring.logs: true
      traefik.enable: true
      traefik.http.routers.transmission.entrypoints: https
      traefik.http.routers.transmission.rule: Host(`torrents.zarantonello.net`)
      traefik.http.services.transmission.loadbalancer.server.port: 9091
    networks:
      - traefik_default
    ports:
      - 51413:51413/tcp
      - 51413:51413/udp
    read_only: true
    restart: always
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:uid=27732,gid=27732
    user: 27732:27732
    volumes:
      - $HOME/volumes/transmission/config:/.config/transmission-daemon
      - $HOME/volumes/transmission/data:/data
